name: Doxygen Action
run-name: Generating Doxygen Page...

on:
  push:
    branches: [ develop ]

jobs:
  gen-doxygen-page:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - uses: DenverCoder1/doxygen-github-pages-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: html
          config_file: Doxyfile
          doxygen_version: 1.14.0
