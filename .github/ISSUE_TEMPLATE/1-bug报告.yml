name: Bug 反馈
description: 当你在代码中发现了一个 Bug，导致应用崩溃或抛出异常，或者有一个组件存在问题，或者某些地方看起来不对劲。
title: "[Bug]: "
labels: ["bug"]
body:
  # - type: markdown
  #   attributes:
  #     value: |
  #       感谢对项目的支持与关注。在提出问题之前，请确保你已查看相关开发或使用文档：
  #       - https://...
  - type: checkboxes
    attributes:
      label: 这个问题是否已经存在？
      description: 在提交新问题之前，请确保你已经搜索过[现有的问题](https://gitee.com/precess/PreCess/issues)，且没有找到类似的问题。如已存在，请到现有的问题下评论，而不是创建一个新的问题。
      options:
        - label: 我已经搜索过现有的问题，且没有找到类似的问题。
          required: true
  - type: textarea
    attributes:
      label: 如何复现
      description: 请详细告诉我们如何复现你遇到的问题，如涉及代码，可提供一个最小代码示例，并使用Markdown语法反引号```附上它
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
      description: 请告诉我们你预期会发生什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
      description: 请告诉我们实际发生了什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 截图或视频
      description: 如果可以的话，上传任何关于 bug 的截图。
      value: |
        [在这里上传图片]
  - type: input
    attributes:
      label: 操作系统
      description: 你当前使用的操作系统和版本是什么？例如 Windows 11 24H2、Ubuntu 20.04、macOS 11.2 等。Windows用户可以按下`Win+r`键，输入`winver`查询操作系统版本
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 你当前正在使用我们软件的哪个版本/分支？如果没有版本号，请附带 Git 提交哈希值。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 其他构建环境信息
      description: 在此提供编译器版本、依赖库版本或任何其他相关的构建环境信息等。
      placeholder: |
        1. 编译器版本：如 MSVC 19.29、GCC 10.2、Clang 12.0 等
        2. 依赖库版本：如 Qt 6.8.0、VTK 9.5.2 等
        3. ...  
  - type: textarea
    attributes:
      label: 其他上下文
      description: 请提供任何其他相关的上下文信息，例如日志文件、配置文件等。