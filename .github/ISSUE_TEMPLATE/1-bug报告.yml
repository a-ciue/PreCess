name: Bug 反馈
description: 当你在代码中发现了一个 Bug，导致应用崩溃或抛出异常，或者有一个组件存在问题，或者某些地方看起来不对劲。
title: "[Bug]: "
labels: ["bug"]
body:
  # - type: markdown
  #   attributes:
  #     value: |
  #       感谢对项目的支持与关注。在提出问题之前，请确保你已查看相关开发或使用文档：
  #       - https://...
  - type: checkboxes
    attributes:
      label: 这个问题是否已经存在？如已存在，请到现有的问题下评论，而不是创建一个新的问题。
      options:
        - label: 我已经搜索过现有的问题 (https://gitee.com/precess/PreCess/issues)，且没有找到类似的问题。
          required: true
  - type: textarea
    attributes:
      label: 如何复现
      description: 请详细告诉我们如何复现你遇到的问题，如涉及代码，可提供一个最小代码示例，并使用反引号```附上它
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
      description: 请告诉我们你预期会发生什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
      description: 请告诉我们实际发生了什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 截图或视频
      description: 如果可以的话，上传任何关于 bug 的截图。
      value: |
        [在这里上传图片]
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: "请选择你使用的操作系统。"
      options:
        - Windows
        - Linux
        - macOS
      default: 0
    validations:
      required: true
  - type: dropdown
    id: compiler
    attributes:
      label: 编译器
      description: "请选择你使用的编译器。"
      options:
        - MSVC（Visual Studio）
        - GCC（包括 MinGW）
        - Clang（包括 Apple Clang）
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 你当前正在使用我们软件的哪个版本/分支？如果没有版本号，请附带 Git 提交哈希值。
    validations:
      required: true