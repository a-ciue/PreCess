<!-- 6. 闭合边成面 -->
<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <rect width="60" height="60" fill="#ffffff"/>
  <g stroke="#d0d0d0" stroke-width="0.5">
    <line x1="0" y1="10" x2="60" y2="10"/>
    <line x1="0" y1="20" x2="60" y2="20"/>
    <line x1="0" y1="30" x2="60" y2="30"/>
    <line x1="0" y1="40" x2="60" y2="40"/>
    <line x1="0" y1="50" x2="60" y2="50"/>
    <line x1="10" y1="0" x2="10" y2="60"/>
    <line x1="20" y1="0" x2="20" y2="60"/>
    <line x1="30" y1="0" x2="30" y2="60"/>
    <line x1="40" y1="0" x2="40" y2="60"/>
    <line x1="50" y1="0" x2="50" y2="60"/>
  </g>
  <polygon points="15,20 45,15 50,40 20,45" fill="none" stroke="#0066cc" stroke-width="1.5"/>
  <circle cx="15" cy="20" r="2.5" fill="#ffffff" stroke="#0066cc" stroke-width="1.5"/>
  <circle cx="45" cy="15" r="2.5" fill="#ffffff" stroke="#0066cc" stroke-width="1.5"/>
  <circle cx="50" cy="40" r="2.5" fill="#ffffff" stroke="#0066cc" stroke-width="1.5"/>
  <circle cx="20" cy="45" r="2.5" fill="#ffffff" stroke="#0066cc" stroke-width="1.5"/>
</svg>
