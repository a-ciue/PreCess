<!-- 13. 尺寸标注 -->
<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <rect width="60" height="60" fill="#ffffff"/>
  <!-- 被标注的矩形 -->
  <rect x="15" y="18" width="30" height="24" fill="none" stroke="#0066cc" stroke-width="1.5"/>
  <!-- 水平尺寸标注 -->
  <line x1="15" y1="48" x2="45" y2="48" stroke="#cc6600" stroke-width="1"/>
  <line x1="15" y1="45" x2="15" y2="51" stroke="#cc6600" stroke-width="0.8"/>
  <line x1="45" y1="45" x2="45" y2="51" stroke="#cc6600" stroke-width="0.8"/>
  <!-- 箭头 -->
  <polygon points="15,48 19,46 19,50" fill="#cc6600"/>
  <polygon points="45,48 41,46 41,50" fill="#cc6600"/>
  <text x="25" y="56" font-size="6" fill="#cc6600" font-weight="bold">30.0</text>
  <!-- 垂直尺寸标注 -->
  <line x1="50" y1="18" x2="50" y2="42" stroke="#cc6600" stroke-width="1"/>
  <line x1="47" y1="18" x2="53" y2="18" stroke="#cc6600" stroke-width="0.8"/>
  <line x1="47" y1="42" x2="53" y2="42" stroke="#cc6600" stroke-width="0.8"/>
  <polygon points="50,18 48,22 52,22" fill="#cc6600"/>
  <polygon points="50,42 48,38 52,38" fill="#cc6600"/>
  <text x="52" y="32" font-size="5" fill="#cc6600" font-weight="bold">24</text>
</svg>
